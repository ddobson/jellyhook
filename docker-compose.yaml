networks:
  jellyhook:
    name: jellyhook
    driver: bridge

volumes:
  # Queue data. Without this, recreating the container discards every queued message.
  rabbitmq_data:

services:
  rabbitmq:
    image: rabbitmq:4.0.5-management-alpine
    # RabbitMQ keys its data directory on the node name, which derives from the hostname.
    # Pinning it keeps the volume usable after the container is recreated.
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/10-jellyhook.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - jellyhook

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        ENV: development
    image: jellyhook:api-local
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ./api:/app
    networks:
      - jellyhook
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      FLASK_APP: api/main.py
      FLASK_ENV: development
      SECRET_KEY: "SuperSecretKey"
      # WEBHOOK_TOKEN: ""  # set to require "Authorization: Bearer <token>" on /hooks/*
    command: flask --app api.main --debug run --host=0.0.0.0 --port=5001
    # The image's own healthcheck targets gunicorn on :8000. This override targets the dev server.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: ./workers
      dockerfile: Dockerfile
      args:
        ENV: development
    image: jellyhook:worker-local
    restart: unless-stopped
    # Run a tiny init as PID 1 so signals reach Python and orphaned ffmpeg/mkvmerge children are
    # reaped.
    init: true
    # On SIGTERM the worker lets in-flight jobs finish for WORKER_SHUTDOWN_GRACE_SECONDS
    # (default 45) before disconnecting. Keep this comfortably above that value.
    stop_grace_period: 60s
    ports:
      - "5678:5678"
    volumes:
      - type: bind
        source: ./workers/jellyhook.local.json
        target: /config/jellyhook.json
      - type: bind
        source: ./workers
        target: /app
      - type: bind
        source: /Volumes/data
        target: /data
      - type: bind
        source: /Volumes/data/jellyhook/tmp
        target: /data/tmp
    networks:
      - jellyhook
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./workers/.env
    environment:
      DEBUG: "1"
      MOVIE_PATH: "/data/media/movies"
      STANDUP_PATH: "/data/media/stand-up"
      RABBITMQ_HOST: rabbitmq
      WORKER_ENV: development
      PYDEVD_DISABLE_FILE_VALIDATION: "1"
      JELLYFIN_API_KEY: "" # Add your Jellyfin API key here
      JELLYFIN_PORT: "8096"  # Default Jellyfin port
      JELLYFIN_HOST: "http://homelab.local"
      JELLYFIN_USER_ID: "" # Add your Jellyfin user ID here
      JELLYHOOK_CONFIG_PATH: "/config/jellyhook.json"
