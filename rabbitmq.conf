# Jellyhook broker overrides. Mounted into /etc/rabbitmq/conf.d/ by docker-compose.yaml.

# A consumer must ack within this window (milliseconds) or the broker closes its channel and
# redelivers the message. The default is 30 minutes, which is shorter than a Dolby Vision
# conversion or track clean on a large remux. 24 hours leaves plenty of headroom.
consumer_timeout = 86400000
