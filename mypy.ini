[mypy]
python_version = 3.13
# Commands run from inside a package; pytest puts tests/integration on sys.path (`import support`)
mypy_path = tests/integration
# support.py is reached through `import support`; discovering it again would register it twice
exclude = (^|/)tests/integration/support\.py$
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_optional = True
warn_redundant_casts = True
warn_return_any = True
warn_unused_ignores = True

# These libraries ship no stubs or py.typed marker.
[mypy-pika.*]
ignore_missing_imports = True

[mypy-jellyfin_apiclient_python.*]
ignore_missing_imports = True

[mypy-debugpy.*]
ignore_missing_imports = True

# Tests are plain pytest functions; annotating every one adds noise, not safety.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
